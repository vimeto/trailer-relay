[project]
name = "trailer-relay"
version = "0.1.0"
description = "Trailer-reversing relay: a task environment and harness for evaluating LLM drivers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vilhelm Toivonen"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "httpx>=0.27"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.urls]
Repository = "https://github.com/vimeto/trailer-relay"
Issues = "https://github.com/vimeto/trailer-relay/issues"
Article = "https://trailer.games.vtoivonen.com/"

[project.scripts]
relay = "relay.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45", "build>=1.2", "twine>=6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls a real model API (opt in with RELAY_LIVE=1)",
  "browser: drives the viewer in headless Chrome",
  "slow: certifies many tracks",
]

[tool.setuptools.data-files]
"share/trailer-relay/viewer" = ["viewer/app.js", "viewer/chips.js", "viewer/data.js", "viewer/driver.js", "viewer/geom2d.js", "viewer/index.html", "viewer/labels.js", "viewer/models.js", "viewer/panels.js", "viewer/results.js", "viewer/scenery.js", "viewer/style.css"]
"share/trailer-relay/viewer/vendor" = ["viewer/vendor/LICENSE", "viewer/vendor/three.module.min.js"]
"share/trailer-relay/viewer/vendor/addons/controls" = ["viewer/vendor/addons/controls/OrbitControls.js"]
"share/trailer-relay/viewer/vendor/addons/lines" = ["viewer/vendor/addons/lines/Line2.js", "viewer/vendor/addons/lines/LineGeometry.js", "viewer/vendor/addons/lines/LineMaterial.js", "viewer/vendor/addons/lines/LineSegments2.js", "viewer/vendor/addons/lines/LineSegmentsGeometry.js"]
